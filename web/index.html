<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinIoT Console</title>
  <link rel="stylesheet" href="style.css?v=0.1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234c8dff'/%3E%3Cpath d='M9 22V10h3v9h7v3H9z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#4c8dff"/>
        <path d="M9 22V10h3v9h7v3H9z" fill="#fff"/>
      </svg>
      <div>
        <div class="logo-name">LinIoT</div>
        <div class="logo-sub">AIoT PLATFORM v0.1</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#/overview" data-route="overview">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
        概览</a>
      <a href="#/devices" data-route="devices">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6.5 1.5v2M9.5 1.5v2M6.5 12.5v2M9.5 12.5v2M1.5 6.5h2M1.5 9.5h2M12.5 6.5h2M12.5 9.5h2"/></svg>
        设备管理</a>
      <a href="#/rules" data-route="rules">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5l6 2.5v3.5c0 3.5-2.5 6-6 7-3.5-1-6-3.5-6-7V4l6-2.5z"/></svg>
        规则与告警</a>
      <a href="#/ai" data-route="ai">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h11v7h-6l-3 3v-3h-2v-7z" stroke-linejoin="round"/></svg>
        AI 助手</a>
    </nav>
    <div class="sidebar-footer">
      <div class="conn-row"><span id="ws-dot" class="dot off"></span><span id="ws-text">连接中</span></div>
      <div class="badges">
        <span id="badge-mqtt" class="badge" title="MQTT 接入通道">MQTT</span>
        <span id="badge-ai" class="badge" title="AI 助手模式">LLM</span>
      </div>
      <a class="api-link" href="/docs" target="_blank">OpenAPI 文档 ↗</a>
    </div>
  </aside>

  <main id="main">
    <div id="toast" class="toast"></div>
    <div id="view"></div>
  </main>

  <script src="app.js?v=0.1.0"></script>
</body>
</html>
