name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请填写以下信息，便于快速定位。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象描述 + 期望行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. liniot run --port 8000
        2. curl -X POST ...
        3. 出现错误
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: "Python 3.12 / macOS 15 / 部署方式（pip/Docker）/ 相关环境变量（脱敏）"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段
      placeholder: 粘贴服务端日志或浏览器控制台报错（脱敏）
